name: Crop regression tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - python: '3.9'
            dependencies: minimum
          - python: '3.10'
            dependencies: current
          - python: '3.13'
            dependencies: current
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install minimum supported dependencies
        if: matrix.dependencies == 'minimum'
        run: python -m pip install numpy==1.23.5 Pillow==10.0.0 scipy==1.10.0
      - name: Install package
        run: python -m pip install .
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify installed wheel outside checkout
        working-directory: /tmp
        run: python -c "from rectcropper import RectangleCropper, crop_image; RectangleCropper()"
      - name: Verify installed command
        working-directory: /tmp
        run: rectcropper --help
